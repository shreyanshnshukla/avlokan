[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avlokan"
version = "0.1.0"
description = "Avlokan — Divya Drishti for every city. Satellite monitoring of water bodies, construction and disaster risk."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shreyansh Nandan Shukla" }]

[tool.setuptools.packages.find]
include = ["avlokan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
